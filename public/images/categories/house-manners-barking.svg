<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
  <rect width="640" height="360" fill="#f7f5f0" rx="24"/>
  
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="36" height="70" rx="2" fill="#efeae2" stroke="#2f5d50" stroke-width="2.5"/>
    <circle cx="28" cy="36" r="3" fill="#2f5d50"/>
  </g>
  <g transform="translate(160,160) scale(1.5)">
    <!-- body -->
    <ellipse cx="40" cy="52" rx="28" ry="18" fill="#2f5d50"/>
    <!-- head -->
    <circle cx="68" cy="38" r="16" fill="#2f5d50"/>
    <!-- ears -->
    <ellipse cx="58" cy="26" rx="6" ry="10" fill="#244a40" transform="rotate(-20 58 26)"/>
    <ellipse cx="76" cy="26" rx="6" ry="10" fill="#244a40" transform="rotate(20 76 26)"/>
    <!-- snout -->
    <ellipse cx="78" cy="42" rx="8" ry="6" fill="#efeae2"/>
    <circle cx="82" cy="40" r="2" fill="#1c2a24"/>
    <!-- eye -->
    <circle cx="72" cy="34" r="2.2" fill="#1c2a24"/>
    <!-- legs -->
    <rect x="22" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="36" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="48" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="58" y="60" width="7" height="18" rx="3" fill="#244a40"/>
    <!-- tail -->
    <path d="M14 48 Q4 36 12 30" fill="none" stroke="#244a40" stroke-width="5" stroke-linecap="round"/>
  </g><rect x="280" y="280" width="160" height="18" rx="8" fill="#f5d9a8" stroke="#2f5d50" stroke-width="1.5"/>
    <text x="360" y="150" font-family="Georgia,serif" font-size="28" fill="#2f5d50">House Manners</text>
    <text x="360" y="190" font-family="system-ui,sans-serif" font-size="16" fill="#1c2a24" opacity="0.7">&amp; quiet living</text>
</svg>
