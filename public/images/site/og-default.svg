<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <rect width="1200" height="630" fill="#f7f5f0" rx="24"/>
  
  
  <g transform="translate(80,100) scale(2)" fill="#a9bfb3" opacity="0.5">
    <ellipse cx="0" cy="8" rx="7" ry="5"/>
    <circle cx="-8" cy="-2" r="3.5"/><circle cx="-2" cy="-6" r="3.5"/>
    <circle cx="5" cy="-6" r="3.5"/><circle cx="10" cy="-1" r="3.5"/>
  </g>
  
  <g transform="translate(1050,480) scale(1.8)" fill="#a9bfb3" opacity="0.5">
    <ellipse cx="0" cy="8" rx="7" ry="5"/>
    <circle cx="-8" cy="-2" r="3.5"/><circle cx="-2" cy="-6" r="3.5"/>
    <circle cx="5" cy="-6" r="3.5"/><circle cx="10" cy="-1" r="3.5"/>
  </g>
  
  <g transform="translate(180,220) scale(2.8)">
    <!-- body -->
    <ellipse cx="40" cy="52" rx="28" ry="18" fill="#2f5d50"/>
    <!-- head -->
    <circle cx="68" cy="38" r="16" fill="#2f5d50"/>
    <!-- ears -->
    <ellipse cx="58" cy="26" rx="6" ry="10" fill="#244a40" transform="rotate(-20 58 26)"/>
    <ellipse cx="76" cy="26" rx="6" ry="10" fill="#244a40" transform="rotate(20 76 26)"/>
    <!-- snout -->
    <ellipse cx="78" cy="42" rx="8" ry="6" fill="#efeae2"/>
    <circle cx="82" cy="40" r="2" fill="#1c2a24"/>
    <!-- eye -->
    <circle cx="72" cy="34" r="2.2" fill="#1c2a24"/>
    <!-- legs -->
    <rect x="22" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="36" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="48" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="58" y="60" width="7" height="18" rx="3" fill="#244a40"/>
    <!-- tail -->
    <path d="M14 48 Q4 36 12 30" fill="none" stroke="#244a40" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="160" y="480" width="420" height="36" rx="8" fill="#f5d9a8" stroke="#2f5d50" stroke-width="1.5"/>
  <text x="620" y="280" font-family="Georgia, serif" font-size="64" fill="#2f5d50" font-weight="600">Settled Paws</text>
  <text x="620" y="340" font-family="system-ui,sans-serif" font-size="28" fill="#1c2a24" opacity="0.75">Calm, practical dog training</text>
  <text x="620" y="380" font-family="system-ui,sans-serif" font-size="28" fill="#1c2a24" opacity="0.75">for real homes</text>

</svg>
