<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img">
  <rect width="720" height="260" fill="#f7f5f0" rx="24"/>
  
  <g transform="translate(80,80)">
    <rect x="10" y="20" width="80" height="28" rx="8" fill="#4a7a68" stroke="#2f5d50" stroke-width="2"/>
    <path d="M28 20 L38 6 H62 L72 20" fill="#e5ede8" stroke="#2f5d50" stroke-width="2"/>
    <circle cx="30" cy="50" r="8" fill="#1c2a24"/>
    <circle cx="70" cy="50" r="8" fill="#1c2a24"/>
    <circle cx="30" cy="50" r="3.5" fill="#a9bfb3"/>
    <circle cx="70" cy="50" r="3.5" fill="#a9bfb3"/>
  </g>
  <g transform="translate(140,50) scale(0.9)">
    <!-- body -->
    <ellipse cx="40" cy="52" rx="28" ry="18" fill="#2f5d50"/>
    <!-- head -->
    <circle cx="68" cy="38" r="16" fill="#2f5d50"/>
    <!-- ears -->
    <ellipse cx="58" cy="26" rx="6" ry="10" fill="#244a40" transform="rotate(-20 58 26)"/>
    <ellipse cx="76" cy="26" rx="6" ry="10" fill="#244a40" transform="rotate(20 76 26)"/>
    <!-- snout -->
    <ellipse cx="78" cy="42" rx="8" ry="6" fill="#efeae2"/>
    <circle cx="82" cy="40" r="2" fill="#1c2a24"/>
    <!-- eye -->
    <circle cx="72" cy="34" r="2.2" fill="#1c2a24"/>
    <!-- legs -->
    <rect x="22" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="36" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="48" y="62" width="7" height="16" rx="3" fill="#244a40"/>
    <rect x="58" y="60" width="7" height="18" rx="3" fill="#244a40"/>
    <!-- tail -->
    <path d="M14 48 Q4 36 12 30" fill="none" stroke="#244a40" stroke-width="5" stroke-linecap="round"/>
  </g>
        <text x="360" y="100" font-family="Georgia,serif" font-size="20" fill="#2f5d50">Car steps</text>
        <text x="360" y="140" font-size="15" fill="#1c2a24">Engine off → treats in car → short drives</text>
        <text x="360" y="170" font-size="15" fill="#1c2a24">Secure with crash-tested harness or crate</text>
</svg>
