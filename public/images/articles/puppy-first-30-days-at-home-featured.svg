<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
  <rect width="800" height="450" fill="#f7f5f0" rx="24"/>
  
  <g transform="translate(140,180) scale(1.7)">
    <!-- body -->
    <ellipse cx="40" cy="52" rx="28" ry="18" fill="#4a7a68"/>
    <!-- head -->
    <circle cx="68" cy="38" r="16" fill="#4a7a68"/>
    <!-- ears -->
    <ellipse cx="58" cy="26" rx="6" ry="10" fill="#2f5d50" transform="rotate(-20 58 26)"/>
    <ellipse cx="76" cy="26" rx="6" ry="10" fill="#2f5d50" transform="rotate(20 76 26)"/>
    <!-- snout -->
    <ellipse cx="78" cy="42" rx="8" ry="6" fill="#efeae2"/>
    <circle cx="82" cy="40" r="2" fill="#1c2a24"/>
    <!-- eye -->
    <circle cx="72" cy="34" r="2.2" fill="#1c2a24"/>
    <!-- legs -->
    <rect x="22" y="62" width="7" height="16" rx="3" fill="#2f5d50"/>
    <rect x="36" y="62" width="7" height="16" rx="3" fill="#2f5d50"/>
    <rect x="48" y="62" width="7" height="16" rx="3" fill="#2f5d50"/>
    <rect x="58" y="60" width="7" height="18" rx="3" fill="#2f5d50"/>
    <!-- tail -->
    <path d="M14 48 Q4 36 12 30" fill="none" stroke="#2f5d50" stroke-width="5" stroke-linecap="round"/>
  </g><rect x="120" y="340" width="220" height="22" rx="8" fill="#f5d9a8" stroke="#2f5d50" stroke-width="1.5"/>
  <g transform="translate(360,280)">
    <circle cx="12" cy="12" r="12" fill="#e8a598"/>
    <circle cx="12" cy="12" r="4" fill="#f7f5f0"/>
  </g>
      <text x="480" y="200" font-family="Georgia,serif" font-size="28" fill="#2f5d50">First 30 days</text>
      <text x="480" y="240" font-size="16" fill="#1c2a24" opacity="0.7">Routines that stick</text>
</svg>
